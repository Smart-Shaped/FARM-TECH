  geoserver:
    build:
      context: geoserver
      dockerfile: Dockerfile
    hostname: geoserver
    ports:
      - "8082:8080"
    environment:
      - INSTALL_EXTENSIONS=true
      - COMMUNITY_EXTENSIONS=s3-geotiff
      - JAVA_OPTS=-Ds3.properties.location=/opt/config/s3.properties
    volumes:
      - geoserver-data:/opt/geoserver_data
      - ./geoserver/s3.properties:/opt/config/s3.properties

  ml_runner:
    build:
      context: ml_runner
      dockerfile: Dockerfile
    hostname: ml_runner
    ports:
      - "8888:8888"
    environment:
      # - SPARK_REMOTE="sc://spark-master"
      - USERNAME=username
      - METAFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./ml_runner/workflows:/app/workflows
      - ./ml_runner/configs:/app/configs
      - ./ml_runner/models:/app/models

