services:

  # Database
  db:
    image: postgres:14-alpine
    hostname: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: t4y_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d t4y_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      target: development
    hostname: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DEBUG=True
    volumes:
      - ./backend:/app
      - backend-media:/app/media
      - backend-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["./entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery:
    build:
      context: backend
      dockerfile: Dockerfile
      target: development
    hostname: celery
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - DEBUG=True
      - DB_NAME=t4y_dev
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend-media:/app/media
      - backend-logs:/app/logs
    depends_on:
      - db
      - redis
      - backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build:
      context: backend
      dockerfile: Dockerfile
      target: development
    hostname: celery-beat
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - DEBUG=True
      - DB_NAME=t4y_dev
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend-logs:/app/logs
    depends_on:
      - db
      - redis
      - backend
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]

  # MinIO for object storage
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
      
      # Configurazione OpenID Connect per Keycloak
      MINIO_IDENTITY_OPENID_CONFIG_URL: "https://auth-tech4you.opsi.lecce.it/auth/realms/farmtech/.well-known/openid-configuration"
      MINIO_IDENTITY_OPENID_CLIENT_ID: "minio"
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: "kiKhjZC8qR50i9MfWF7UvRhKSOXhKTCu"
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: "Keycloak SSO"
      
      # Claim per mappare le policy MinIO (usa questo approccio)
      MINIO_IDENTITY_OPENID_CLAIM_NAME: "policy"
      MINIO_IDENTITY_OPENID_CLAIM_PREFIX: ""
      
      # Scopes da richiedere a Keycloak
      MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email"
      
      # URL di redirect (modifica con il tuo dominio in produzione)
      MINIO_IDENTITY_OPENID_REDIRECT_URI: "http://localhost:9001/oauth_callback"

    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 2s
      retries: 3

  # MinIO Client for initialization
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
      WEBHOOK_URL: "http://backend:8000/api/v1/minio/webhook/"
      BUCKET_NAME: "farmtech"
      MINIO_URL: "http://minio:9000"
    volumes:
      - ./minio/entrypoint.sh:/opt/minio/entrypoint.sh
    entrypoint: ["/bin/sh", "/opt/minio/entrypoint.sh"]

  # GeoServer for geospatial data serving
  geoserver:
    build:
      context: geoserver
      dockerfile: Dockerfile
    hostname: geoserver
    ports:
      - "8082:8080"
    environment:
      - INSTALL_EXTENSIONS=true
      - COMMUNITY_EXTENSIONS=s3-geotiff
      - JAVA_OPTS=-Ds3.properties.location=/opt/config/s3.properties
    volumes:
      - geoserver-data:/opt/geoserver_data
      - ./geoserver/s3.properties:/opt/config/s3.properties

  # ML Runner Service
  ml_runner:
    build:
      context: ml_runner
      dockerfile: Dockerfile
    hostname: ml_runner
    ports:
      - "8888:8888"
    environment:
      - USERNAME=username
      - METAFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./ml_runner/workflows:/app/workflows
      - ./ml_runner/configs:/app/configs
      - ./ml_runner/data:/app/data

volumes:
  postgres-data:
  redis-data:
  backend-media:
  backend-static:
  backend-logs:
  minio-data:
  geoserver-data:
