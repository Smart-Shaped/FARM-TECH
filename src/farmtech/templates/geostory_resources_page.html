{% extends "page.html" %}

{% block container %}
    <div class="gn-container">
        
        <h2>My Custom Text Section</h2>
        
        <p class="lead">This is the introductory text that sits inside the main content container of the GeoNode page.</p>

        <div class="row">
            <div class="col-md-6">
                <p>More detailed text or paragraphs can go here.</p>
            </div>
        </div>

    </div>
    <div class="gn-container">
        <div id="custom-resources-grid"></div>
    </div>
    <script>
        window.addEventListener('mapstore:ready', function(event) {
            const msAPI = event.detail;
            msAPI.setPluginsConfig([
                {
                    name: 'ResourcesGrid',
                    cfg: {
                        targetSelector: '#custom-resources-grid',
                        containerSelector: '.gn-container',
                        menuItems: [],
                        filtersFormItems: [],
                        defaultQuery: {
                            f: 'geostory'
                        },
                        pagination: true
                    }
                },
                { name: 'SaveAs', cfg: { closeOnSave: true } },
                { name: 'DeleteResource' },
                { name: 'DownloadResource' },
                { name: 'Notifications' }
            ]);
        });
    </script>
{% endblock %}
